[package]
name = "look-perf-tools"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["kunkka19xx <nobita079x@gmail.com>"]
version = "0.1.0"
publish = false
description = "Perf and stress benches for look's index refresh / watcher path. Not shipped in any app bundle."

[dependencies]
look-engine = { path = "../../core/engine" }
look-indexing = { path = "../../core/indexing" }
look-matching = { path = "../../core/matching" }
look-storage = { path = "../../core/storage" }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "query_engine_bench"
path = "query_engine_bench.rs"

[[bin]]
name = "scoped_refresh_bench"
path = "scoped_refresh_bench.rs"

[[bin]]
name = "watcher_stress"
path = "watcher_stress.rs"

[[bin]]
name = "real_fs_stress"
path = "real_fs_stress.rs"

[[bin]]
name = "search_stress"
path = "search_stress.rs"

[[bin]]
name = "ipc_stress"
path = "ipc_stress.rs"

[[bin]]
name = "system_stress"
path = "system_stress.rs"
