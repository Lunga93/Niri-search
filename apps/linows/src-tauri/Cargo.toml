[package]
name = "lookapp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["kunkka19xx <nobita079x@gmail.com>"]

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
look-answers = { path = "../../../core/answers" }
look-calc = { path = "../../../core/calc" }
look-engine = { path = "../../../core/engine" }
look-matching = { path = "../../../core/matching" }
look-netspeed = { path = "../../../core/netspeed" }
look-qactions = { path = "../../../core/qactions" }
look-sources = { path = "../../../core/sources" }
look-storage = { path = "../../../core/storage" }
look-todo = { path = "../../../core/todo" }
look-tools = { path = "../../../core/tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
open = "5"
base64 = "0.22"
rodio = "0.20"
arboard = { version = "3", features = ["wayland-data-control"] }
dirs = "6"
tauri-plugin-dialog = "2"
trash = "5"
tokio = { version = "1.52.3", features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
# Window/display pointers for the Wayland blur bind, without GDK FFI.
raw-window-handle = "0.6"
zbus = "5"
# StreamExt for zbus signal streams.
futures-util = { version = "0.3", default-features = false }
webkit2gtk = "2.0"
# dlopen for libgtk-layer-shell: absent on some distros, so it must not be a
# link-time dependency.
libloading = "0.8"
# Owning the clipboard in-process, which is the only way to offer a path as
# BOTH a file (for a file manager) and text (for everything else): wl-copy and
# xclip each advertise a single MIME type per invocation. Pinned to the version
# WebKitGTK already pulls in, so this adds no new build.
gtk = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
# "system" pins the libwayland backend: blur binds against GTK's own
# wl_display, which only the sys backend can adopt.
wayland-client = { version = "0.31", features = ["system"], default-features = false }
wayland-protocols-wlr = { version = "0.3", features = ["client"], default-features = false }
# Behind-window blur: the cross-desktop staging protocol (KWin 6.7+, Hyprland
# 0.56+, Niri; Mutter in review) plus KDE's own, which Plasma used until 6.7.
wayland-protocols = { version = "0.32", features = [
    "client",
    "staging",
], default-features = false }
wayland-protocols-plasma = { version = "0.3", features = [
    "client",
], default-features = false }



[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
