name: Release Linux

# Builds the Niri-Search .deb (Ubuntu) and .rpm (Fedora container) and
# attaches both to a GitHub Release. Trigger by pushing a v* tag
# (e.g. v0.2.0) or manually with an explicit version.
#
# Version flow: the tag (or the dispatch input) is the single source of
# truth. A sync step rewrites the version in tauri.conf.json and the
# src-tauri Cargo.toml in the CI workspace only (nothing is committed
# back), so build.rs stamps APP_VERSION correctly.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0, without the leading v)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Run core workspace tests
        run: cargo test --workspace --manifest-path core/Cargo.toml

  resolve-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  deb:
    name: Build .deb (Ubuntu)
    needs: [test, resolve-version]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linows/src-tauri -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl pkg-config \
            libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf-2.0-dev libharfbuzz-dev libdbus-1-dev \
            libasound2-dev librsvg2-dev libappindicator3-dev
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Sync version from release tag
        run: |
          python3 scripts/ci/sync-version.py "$VERSION"
      - name: Build .deb
        working-directory: apps/linows
        run: cargo tauri build --bundles deb
      - name: Rename artifact deterministically
        run: |
          mkdir -p dist
          f=$(ls apps/linows/src-tauri/target/release/bundle/deb/*.deb | head -1)
          cp "$f" "dist/niri-search_${VERSION}_amd64.deb"
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/niri-search_${{ env.VERSION }}_amd64.deb

  rpm:
    name: Build .rpm (Fedora)
    needs: [test, resolve-version]
    runs-on: ubuntu-24.04
    container: fedora:41
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linows/src-tauri -> target
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc pkg-config openssl-devel \
            gtk3-devel webkit2gtk4.1-devel libsoup3-devel \
            glib2-devel cairo-devel pango-devel gdk-pixbuf2-devel \
            harfbuzz-devel dbus-devel alsa-lib-devel \
            librsvg2-devel libappindicator-gtk3-devel \
            curl git
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Sync version from release tag
        run: |
          python3 scripts/ci/sync-version.py "$VERSION"
      - name: Build .rpm
        working-directory: apps/linows
        run: cargo tauri build --bundles rpm
      - name: Rename artifact deterministically
        run: |
          mkdir -p dist
          f=$(ls apps/linows/src-tauri/target/release/bundle/rpm/*.rpm | grep -v ".src.rpm" | head -1)
          cp "$f" "dist/niri-search-${VERSION}-1.x86_64.rpm"
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/niri-search-${{ env.VERSION }}-1.x86_64.rpm

  release:
    name: Publish GitHub Release
    needs: [deb, rpm, resolve-version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum niri-search_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: Niri-Search v${{ needs.resolve-version.outputs.version }}
          files: |
            dist/niri-search_*.deb
            dist/niri-search-*.rpm
            dist/SHA256SUMS.txt
          generate_release_notes: true
